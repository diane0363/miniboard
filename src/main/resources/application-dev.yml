spring:
  datasource:
    url: jdbc:mysql://localhost:3306/miniboard?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    # password: ${DB_PASSWORD}           # 환경변수 방식
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update                # 로컬만 update. 운영은 validate 
    show-sql: true                    # 쿼리를 한 줄로 안 쓰고 예쁘게 정렬해서 보여주는 옵션 (콘솔창에서 JPA 코드가 의도한 대로 쿼리를 잘 만들어내고 있는지 확인)
    properties:
      hibernate.format_sql: true
  thymeleaf:
    cache: false                      # 개발 중 템플릿 즉시 반영
logging:
  level:
    org.hibernate.SQL: debug