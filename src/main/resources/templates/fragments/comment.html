<!-- templates/fragments/comment.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

    <!-- ★ 댓글 1개(+ 대댓글들)를 그리는 조각. Controller와 초기로딩이 공유 -->
    <!-- 파라미터 (comment) 를 명시적으로 선언 -->
    <div th:fragment="commentItem(comment)" th:id="'comment-' + ${comment.id}" class="comment-item"
        th:data-comment-id="${comment.id}">

        <!-- ── 본체 ── -->
        <div class="comment-body">
            <!-- ★ 삭제 여부로 렌더 분기 : 플레이스홀더 vs 정상 -->
            <th:block th:if="${comment.deleted}">
                <span class="comment-deleted">삭제된 댓글입니다.</span>
            </th:block>

            <th:block th:unless="${comment.deleted}">
                <span class="comment-author" th:text="${comment.authorNickname}">닉네임</span>
                <!-- ★ th:text = 자동 이스케이프 → XSS 방어. th:utext 절대 금지 -->
                <p class="comment-content" th:text="${comment.content}">내용</p>
                <span class="comment-date"
                    th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span>

                <!-- ★ [답글]·[삭제]는 로그인+본인일 때만 노출 (UX). 서버 검증은 별개로 무조건 돈다 -->
                <button type="button" class="btn-reply" th:data-comment-id="${comment.id}">답글</button>
                <button type="button" class="btn-delete-comment" sec:authorize="isAuthenticated()"
                    th:if="${#authentication.principal.userId == comment.authorId}"
                    th:data-comment-id="${comment.id}">삭제</button>
            </th:block>
        </div>

        <!-- ── 답글 입력창 (숨김. [답글] 클릭 시 노출) ── -->
        <div class="reply-form" th:id="'reply-form-' + ${comment.id}" style="display:none;">
            <textarea class="reply-content" maxlength="1000" placeholder="답글을 입력하세요"></textarea>
            <button type="button" class="btn-submit-reply" th:data-parent-id="${comment.id}"
                th:data-post-id="${comment.postId}">등록</button>
        </div>

        <!-- ── 대댓글 목록 (1-depth. 들여쓰기 한 단계) ── -->
        <div class="replies" th:id="'replies-' + ${comment.id}">
            <div class="reply-item" th:each="reply : ${comment.replies}" th:id="'comment-' + ${reply.id}"
                th:data-comment-id="${reply.id}">
                <span class="comment-author" th:text="${reply.authorNickname}">닉네임</span>
                <p class="comment-content" th:text="${reply.content}">내용</p>
                <span class="comment-date" th:text="${#temporals.format(reply.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
                <button type="button" class="btn-delete-comment" sec:authorize="isAuthenticated()"
                    th:if="${#authentication.principal.userId == reply.authorId}"
                    th:data-comment-id="${reply.id}">삭제</button>
            </div>
        </div>
    </div>

</body>

</html>
