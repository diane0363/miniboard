<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ★ CSRF 토큰 : 모든 AJAX가 읽어갈 공통 소스 -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <!-- ★ jQuery : 공통으로 한 번만. 하위 페이지는 중복 로드 금지 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- ★ 전역 CSRF 자동 첨부 : 이 사이트의 '모든' AJAX에 토큰이 자동으로 실린다 -->
    <script>
        $(function () {
            const token = $("meta[name='_csrf']").attr("content");
            const header = $("meta[name='_csrf_header']").attr("content");
            if (token && header) {
                $(document).ajaxSend(function (e, xhr) {
                    xhr.setRequestHeader(header, token);
                });
            }
        });
    </script>

    <title layout:title-pattern="$CONTENT_TITLE">MiniBoard</title>
    <!-- 하위 페이지가 추가 <head> 요소를 병합할 자리 -->
</head>

<body>

    <!-- ★ 공통 헤더 — 로그인 상태 표시 (이제 모든 페이지에 자동으로!) -->
    <header>
        <div style="text-align: right;">
            <span sec:authorize="isAuthenticated()">
                <strong sec:authentication="principal.nickname">사용자</strong>님 환영합니다.
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit">로그아웃</button>
                </form>
            </span>
            <span sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}"><button type="button">로그인</button></a>
            </span>
        </div>
        <hr />
    </header>

    <!-- ★ 각 페이지의 본문이 여기로 끼워진다 -->
    <main layout:fragment="content">
        <p>여기에 페이지 내용이 들어옵니다.</p>
    </main>

    <!-- 공통 푸터 -->
    <footer>
        <hr />
        <p style="text-align:center; color:gray;">© 2026 미니게시판 학습 프로젝트</p>
    </footer>

</body>

</html>
